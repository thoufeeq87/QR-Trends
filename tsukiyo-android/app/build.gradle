plugins {
    id 'com.android.application'
}

android {
    namespace 'os.tsukiyo.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "os.tsukiyo.phone"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No libraries are needed: the app only uses what Android already has.

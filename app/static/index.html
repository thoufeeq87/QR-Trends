<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QA Pulse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1 id="page-title">QA Pulse</h1>
      <select id="domain-select" aria-label="Choose tracked domain">
        <option value="qa">QA Pulse</option>
        <option value="agents">AI Agent Pulse</option>
      </select>
    </div>
    <p id="page-subtitle">What's trending, stable, or fading in software QA/testing.</p>
    <p class="last-updated" id="last-updated"></p>
  </header>
  <main>
    <section>
      <h2><span class="dot new"></span>New this week</h2>
      <div class="card-grid" id="section-new"></div>
    </section>
    <section>
      <h2><span class="dot relevant"></span>Still relevant</h2>
      <div class="card-grid" id="section-relevant"></div>
    </section>
    <section>
      <h2><span class="dot fading"></span>Fading</h2>
      <div class="card-grid" id="section-fading"></div>
    </section>
  </main>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QA Pulse</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>QA Pulse</h1>
    <p>What's trending, stable, or fading in software QA/testing.</p>
  </header>
  <main>
    <section>
      <h2><span class="dot new"></span>New this week</h2>
      <div class="card-grid" id="section-new"></div>
    </section>
    <section>
      <h2><span class="dot relevant"></span>Still relevant</h2>
      <div class="card-grid" id="section-relevant"></div>
    </section>
    <section>
      <h2><span class="dot fading"></span>Fading</h2>
      <div class="card-grid" id="section-fading"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
